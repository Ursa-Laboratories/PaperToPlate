# Run on a homed, physically verified station; read README.md before loading.
# Routing v1 accepts liquid commands only. Homing, operator checks and timing are manual.
# Start timing at the FIRST dye transfer; wait >=5 min after the LAST dye transfer,
# and finish BOTH absorbance readings <=60 min after the FIRST dye transfer.
# This YAML does not enforce incubation timing and does not acquire absorbance.
# Ernst & Zor, JoVE 1918 (2010), doi:10.3791/1918. Read README.md.
# Six BSA levels (0-5 ug) + three prepared 1:10 unknowns + water blanks; triplicates.
# 200 uL final volume. Uses 72 fresh tips A7-G6 after protocol 1.
# Requires external 590/450 nm absorbance reader; camera is not an absorbance reader.
# No physical calibration or assay performance has been validated.
