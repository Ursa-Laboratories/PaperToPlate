[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ursa-paper-to-plate"
version = "0.1.0"
description = "Paper-to-protocol research workbench powered by CubOS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pypdf>=5,<7", "pydantic>=2.10,<3", "PyYAML>=6,<7",
  "python-multipart>=0.0.20,<1", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/paper_to_plate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
